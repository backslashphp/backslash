baseURL = 'https://backslashphp.github.io/'
languageCode = 'en-ca'
title = 'Backslash PHP Developer Guide'
theme = 'book'

enableGitInfo = true
enableRobotsTXT = true

[params]
  description = "Modern PHP library for building event-sourced applications with CQRS"
  author = "Maxime Gosselin"

  # Book theme specific
  BookRepo = 'https://github.com/backslashphp/backslash'
  BookSection = '*'
  BookEditPath = 'edit/main'
  BookSearch = true
  BookToC = true
  BookComments = false
  BookTheme = 'auto'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true

[menu]
  [[menu.main]]
    name = "Getting Started"
    weight = 1
    identifier = "getting-started"

  [[menu.main]]
    name = "Event Sourcing"
    weight = 2
    identifier = "event-sourcing"

  [[menu.main]]
    name = "CQRS"
    weight = 3
    identifier = "cqrs"

  [[menu.main]]
    name = "Testing"
    weight = 4
    identifier = "testing"

  [[menu.main]]
    name = "Customization"
    weight = 5
    identifier = "customization"

  [[menu.main]]
    name = "Application Setup"
    weight = 6
    identifier = "application-setup"

  [[menu.main]]
    name = "Maintenance"
    weight = 7
    identifier = "maintenance"

